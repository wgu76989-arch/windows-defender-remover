name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v13.1)'
        required: true
        default: 'v13.1'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.event.inputs.version }}'.Trim()
          if ($v -notmatch '^v') { $v = "v$v" }
          $vnum = $v -replace '^v', ''
          $vparts = ($vnum -split '\.')
          while ($vparts.Count -lt 4) { $vparts += '0' }
          $v4 = ($vparts[0..3] -join '.')
          "tag=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "vnum=$vnum" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "v4=$v4" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Download rcedit
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe' -OutFile 'rcedit.exe' -UseBasicParsing

      - name: Build DefenderRemover.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Stage files for payload
          New-Item -ItemType Directory -Force -Path 'payload' | Out-Null
          Copy-Item 'Script_Run.bat' 'payload\'
          Copy-Item 'files_removal.bat' 'payload\'
          Copy-Item 'RemoveSecHealthApp.ps1' 'payload\'
          Copy-Item 'PowerRun.exe' 'payload\'
          Copy-Item 'Remove_Defender' 'payload\Remove_Defender' -Recurse -Force
          Copy-Item 'Remove_SecurityComp' 'payload\Remove_SecurityComp' -Recurse -Force

          # Create payload.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            "$PWD\payload", "$PWD\payload.zip",
            [System.IO.Compression.CompressionLevel]::Optimal, $false)
          Write-Host "payload.zip: $((Get-Item 'payload.zip').Length) bytes"

          # Find System.IO.Compression.dll in GAC
          $compDll = (Get-ChildItem 'C:\Windows\Microsoft.NET\assembly\GAC_MSIL\System.IO.Compression' -Recurse -Filter 'System.IO.Compression.dll' | Select-Object -First 1).FullName
          if (-not $compDll) { throw 'System.IO.Compression.dll not found in GAC' }

          # Compile with .NET Framework csc.exe
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $exeName = "DefenderRemover_${{ steps.ver.outputs.tag }}.exe"
          & $csc /nologo /optimize+ `
            "/out:$exeName" `
            "/reference:$compDll" `
            '/resource:payload.zip' `
            '/win32icon:app_icon.ico' `
            '/target:exe' `
            'sfx\Program.cs' 2>&1 | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { throw "csc.exe exited with code $LASTEXITCODE" }
          if (-not (Test-Path $exeName)) { throw "Failed to compile $exeName" }
          Write-Host "Created $exeName ($((Get-Item $exeName).Length) bytes)"

          # Set version info
          .\rcedit.exe $exeName `
            --set-version-string 'ProductName' 'Defender Remover' `
            --set-version-string 'CompanyName' 'Gallery Inc' `
            --set-version-string 'FileDescription' 'Defender Remover' `
            --set-version-string 'LegalCopyright' 'Gallery Inc' `
            --set-version-string 'FileVersion' '${{ steps.ver.outputs.vnum }}' `
            --set-version-string 'ProductVersion' '${{ steps.ver.outputs.vnum }}' `
            --set-file-version '${{ steps.ver.outputs.v4 }}' `
            --set-product-version '${{ steps.ver.outputs.v4 }}'
          Write-Host "Version info set"

      - name: Package raw scripts (zip)
        shell: pwsh
        run: |
          $staging = "staging\DefenderRemover_${{ steps.ver.outputs.tag }}"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          $exclude = @('.git', '.github', 'site-res', 'staging', 'sfx', 'payload')
          Get-ChildItem -Force | Where-Object {
            $exclude -notcontains $_.Name -and
            $_.Name -notlike 'DefenderRemover_*' -and
            $_.Name -notlike 'ISOMaker_*' -and
            $_.Name -ne 'rcedit.exe' -and
            $_.Name -ne 'payload.zip' -and
            $_.Name -ne 'SHA256SUMS.txt'
          } | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination $staging -Recurse -Force
          }
          $zip = "DefenderRemover_${{ steps.ver.outputs.tag }}.zip"
          Compress-Archive -Path "$staging\*" -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip"

      - name: Package ISO Maker (zip)
        shell: pwsh
        run: |
          $isoZip = "ISOMaker_${{ steps.ver.outputs.tag }}.zip"
          if (Test-Path "ISO_Maker") {
            Compress-Archive -Path "ISO_Maker\*" -DestinationPath $isoZip -CompressionLevel Optimal
            Write-Host "Created $isoZip"
          }

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem -Filter "*.zip" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File -FilePath "SHA256SUMS.txt" -Append -Encoding ascii
          }
          $exeFile = Get-ChildItem -Filter "DefenderRemover_${{ steps.ver.outputs.tag }}.exe" -ErrorAction SilentlyContinue
          if ($exeFile) {
            $hash = (Get-FileHash $exeFile.FullName -Algorithm SHA256).Hash
            "$hash  $($exeFile.Name)" | Out-File -FilePath "SHA256SUMS.txt" -Append -Encoding ascii
          }
          Get-Content "SHA256SUMS.txt"

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Windows Defender Remover ${{ steps.ver.outputs.tag }}"
          body: |
            ## Windows Defender Remover ${{ steps.ver.outputs.tag }}

            Automated build from source via GitHub Actions.

            ### Downloads
            - **DefenderRemover_${{ steps.ver.outputs.tag }}.exe** - Standalone executable (self-extracting, runs Script_Run.bat automatically)
            - **DefenderRemover_${{ steps.ver.outputs.tag }}.zip** - Raw scripts (Script_Run.bat, registry files, PowerRun.exe)
            - **ISOMaker_${{ steps.ver.outputs.tag }}.zip** - ISO integration files
            - **SHA256SUMS.txt** - Checksums for all files

            ### Usage (exe)
            1. Download DefenderRemover_${{ steps.ver.outputs.tag }}.exe
            2. Right-click and Run as administrator
            3. Choose [Y] to remove Defender + Security App, or [A] to keep Security App
            4. Reboot when prompted

            Requires Windows 10/11. A System Restore point is recommended before use.
          prerelease: ${{ github.event.inputs.prerelease }}
          files: |
            DefenderRemover_${{ steps.ver.outputs.tag }}.exe
            *.zip
            SHA256SUMS.txt